name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: ""
          - os: macos-latest
            platform: mac
            args: "--arm64"
          - os: macos-13
            platform: mac
            args: "--x64"
          - os: ubuntu-latest
            platform: linux
            args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing on macOS (no Apple Developer cert)
          CSC_IDENTITY_AUTO_DISCOVERY: false
