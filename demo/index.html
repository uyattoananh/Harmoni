<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmoni — Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: rgba(10, 10, 10, 0.95);
      --surface: rgba(255, 255, 255, 0.06);
      --surface-hover: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f0f0;
      --text-dim: rgba(255, 255, 255, 0.5);
      --play-btn-bg: #fff;
      --play-btn-color: #000;
      --font-family: 'Inter', sans-serif;
      --art-radius: 14px;
      --bar-radius: 24px;
    }

    body {
      font-family: var(--font-family);
      background: #000;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 40px;
      padding: 40px;
      flex-wrap: wrap;
    }

    /* ── Demo Layout ── */
    .demo-container {
      display: flex;
      gap: 30px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }

    .demo-label {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Main Player ── */
    .player {
      width: 380px;
      height: 680px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      backdrop-filter: blur(40px);
    }

    .player-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      filter: blur(80px) saturate(1.5) brightness(0.4);
      transform: scale(1.5); z-index: 0; opacity: 0.6;
    }
    .player-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 1; }

    .player-content {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; flex: 1;
      padding: 0 24px 24px;
    }

    .titlebar {
      display: flex; align-items: center; justify-content: flex-end;
      height: 38px; padding: 0 8px; flex-shrink: 0;
    }
    .titlebar-btn {
      width: 28px; height: 28px; border: none; background: none;
      color: var(--text-dim); border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; transition: all 0.12s;
    }
    .titlebar-btn:hover { background: var(--surface-hover); color: var(--text); }

    .player-header {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 4px; position: relative;
    }
    .room-name {
      font-size: 13px; font-weight: 600; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 1px;
      position: absolute; left: 50%; transform: translateX(-50%);
    }
    .icon-btn {
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      padding: 8px; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; transition: all 0.12s;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface); }

    .album-art-wrapper { display: flex; justify-content: center; padding: 12px 0 20px; }
    .album-art {
      width: 220px; height: 220px; border-radius: var(--art-radius);
      overflow: hidden; box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .album-art img { width: 100%; height: 100%; object-fit: cover; }

    .track-info { text-align: center; padding: 0 8px 6px; }
    .track-title { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
    .track-artist { color: var(--text-dim); font-size: 14px; margin-top: 4px; }

    .progress-section { padding: 0 4px 16px; }
    .slider {
      -webkit-appearance: none; width: 100%; height: 4px;
      border-radius: 2px; background: var(--surface); outline: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 6px; height: 6px;
      border-radius: 50%; background: var(--text);
    }
    .time-row {
      display: flex; justify-content: space-between; font-size: 10px;
      color: var(--text-dim); margin-top: 6px; font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex; align-items: center; justify-content: center;
      gap: 20px; padding-bottom: 24px;
    }
    .ctrl-btn { color: var(--text); cursor: pointer; background: none; border: none; padding: 8px; border-radius: 8px; }
    .ctrl-btn:hover { background: var(--surface); }
    .mode-btn { color: var(--text-dim); opacity: 0.5; cursor: pointer; background: none; border: none; padding: 8px; border-radius: 8px; }
    .mode-btn.active { color: var(--text); opacity: 1; }
    .play-btn {
      width: 60px; height: 60px; border-radius: 50%;
      background: var(--play-btn-bg); color: var(--play-btn-color);
      border: none; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all 0.12s;
    }
    .play-btn:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(255,255,255,0.15); }

    .up-next { padding: 0 4px; flex: 1; min-height: 0; overflow-y: auto; }
    .up-next-label {
      font-size: 10px; font-weight: 600; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .up-next-list { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
    .up-next-item { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; }
    .up-next-item:hover { background: var(--surface); }
    .up-next-item-art {
      width: 28px; height: 28px; border-radius: 4px; background: var(--surface);
      overflow: hidden; flex-shrink: 0;
    }
    .up-next-item-art img { width: 100%; height: 100%; object-fit: cover; }
    .up-next-item-title { font-size: 12px; font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .up-next-item-artist { font-size: 11px; color: var(--text-dim); max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .volume-section { display: flex; align-items: center; gap: 10px; margin-top: auto; }
    .vol-label { font-size: 11px; color: var(--text-dim); min-width: 22px; text-align: right; }

    /* ── Minibar ── */
    .minibar-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .minibar {
      height: 48px; display: flex; align-items: center; gap: 10px;
      padding: 0 6px 0 4px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--bar-radius); position: relative; min-width: 340px;
      backdrop-filter: blur(30px);
    }
    .mini-art {
      width: 36px; height: 36px; border-radius: 50%; overflow: hidden;
      background: var(--surface); flex-shrink: 0;
    }
    .mini-art img { width: 100%; height: 100%; object-fit: cover; }
    .mini-info { flex: 1; min-width: 0; }
    .mini-text { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-text .artist { color: var(--text-dim); font-weight: 400; }
    .mini-progress { width: 100%; height: 2px; background: var(--surface); margin-top: 2px; border-radius: 1px; }
    .mini-progress-fill { height: 100%; width: 45%; background: rgba(255,255,255,0.5); border-radius: 1px; }
    .mini-controls { display: flex; gap: 0; flex-shrink: 0; }
    .mini-btn {
      width: 28px; height: 28px; border: none; background: none;
      color: var(--text-dim); cursor: pointer; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .mini-btn:hover { color: var(--text); background: var(--surface); }
    .mini-btn.play { width: 30px; height: 30px; color: #fff; background: rgba(255,255,255,0.12); }
    .mini-btn.play:hover { background: rgba(255,255,255,0.22); }
    .mini-btn.aa {
      font-size: 9px; font-weight: 700; color: var(--text);
      border: 1.5px solid var(--text); border-radius: 4px;
      width: auto; padding: 2px 5px; opacity: 0.6;
    }

    /* ── Locket ── */
    .locket {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 16px; min-width: 280px; backdrop-filter: blur(30px);
    }
    .locket-art {
      width: 56px; height: 56px; border-radius: 10px; overflow: hidden;
      background: var(--surface); flex-shrink: 0; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .locket-art img { width: 100%; height: 100%; object-fit: cover; }
    .locket-info { flex: 1; min-width: 0; }
    .locket-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .locket-artist { font-size: 11px; color: var(--text-dim); }
    .locket-progress { width: 100%; height: 2px; background: var(--surface); margin-top: 4px; border-radius: 1px; }
    .locket-progress-fill { height: 100%; width: 35%; background: var(--text-dim); border-radius: 1px; }
    .locket-controls { display: flex; gap: 2px; }
    .locket-btn {
      width: 32px; height: 32px; border: none; background: none;
      color: var(--text-dim); cursor: pointer; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    .locket-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .locket-btn.play-sm { width: 36px; height: 36px; background: rgba(255,255,255,0.1); border-radius: 50%; color: #fff; }

    /* ── Theme Picker ── */
    .theme-picker-demo {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(20,20,20,0.95); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 10px 14px; display: flex; gap: 6px;
      backdrop-filter: blur(20px); z-index: 100;
    }
    .theme-chip {
      padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: 600;
      cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
      background: none; color: #aaa; transition: all 0.15s; white-space: nowrap;
    }
    .theme-chip:hover { border-color: #fff; color: #fff; }
    .theme-chip.active { background: #fff; color: #000; border-color: #fff; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* ══ THEMES ══ */
    [data-theme="light"] { --bg: #f5f5f7; --surface: #e8e8ec; --surface-hover: #dddde2; --border: #d0d0d5; --text: #1a1a1a; --text-dim: #777; --play-btn-bg: #1a1a1a; --play-btn-color: #fff; }
    [data-theme="light"] .player-bg, [data-theme="light"] .player-overlay { display: none; }
    [data-theme="light"] .track-title { color: #1a1a1a; }
    [data-theme="light"] .mini-btn.aa { color: #000; border-color: #000; }

    [data-theme="xp"] { --bg: #ece9d8; --surface: #fff; --border: #aca899; --text: #000; --text-dim: #4a4a4a; --play-btn-bg: #316ac5; --play-btn-color: #fff; --font-family: 'Tahoma', sans-serif; --art-radius: 2px; --bar-radius: 8px; }
    [data-theme="xp"] .player-bg, [data-theme="xp"] .player-overlay { display: none; }
    [data-theme="xp"] .titlebar { background: linear-gradient(180deg, #0997ff 0%, #003bb5 100%); }
    [data-theme="xp"] .titlebar-btn { color: #fff; }
    [data-theme="xp"] .player { border: 3px solid #0054e3; border-radius: 8px; }
    [data-theme="xp"] .album-art { border: 2px solid #aca899; border-color: #808080 #fff #fff #808080; border-radius: 0; }

    [data-theme="vinyl"] { --bg: #2c2218; --surface: #3d3127; --border: #5a4a3a; --text: #f0e0c8; --text-dim: #a08868; --play-btn-bg: #c8a06e; --play-btn-color: #2c2218; --font-family: 'Georgia', serif; --art-radius: 50%; }
    [data-theme="vinyl"] .track-title { font-style: italic; }

    [data-theme="neon"] { --bg: #08000f; --surface: #1a0a2a; --border: #3a1a55; --text: #fff; --text-dim: #66cccc; --play-btn-bg: #ff00ff; --play-btn-color: #000; }
    [data-theme="neon"] .player { border-color: #4400aa; box-shadow: 0 0 30px rgba(255,0,255,0.08); }
    [data-theme="neon"] .play-btn { box-shadow: 0 0 20px rgba(255,0,255,0.5); }
    [data-theme="neon"] .track-title { text-transform: uppercase; letter-spacing: 2px; font-size: 16px; text-shadow: 0 0 10px rgba(0,255,255,0.4); }

    [data-theme="radio"] { --bg: #1c1410; --surface: #2e2218; --border: #4a3828; --text: #ffd599; --text-dim: #a08050; --play-btn-bg: #d4900a; --play-btn-color: #1c1410; --font-family: 'Georgia', serif; --art-radius: 50%; }
    [data-theme="radio"] .track-title { font-family: 'Courier New', monospace; }

    [data-theme="retro"] { --bg: #FFF5D5; --surface: #f0e8c8; --border: #000; --text: #000; --text-dim: #555; --play-btn-bg: #000; --play-btn-color: #FFF5D5; --font-family: 'JetBrains Mono', monospace; --art-radius: 50%; --bar-radius: 0; }
    [data-theme="retro"] .player-bg, [data-theme="retro"] .player-overlay { display: none; }
    [data-theme="retro"] .player { border: 2px solid #000; border-radius: 0; }
    [data-theme="retro"] .mini-btn.aa { color: #000; border-color: #000; }

    [data-theme="terminal"] { --bg: #0a0a0a; --surface: #141414; --border: #1db954; --text: #1db954; --text-dim: #0d8a3a; --play-btn-bg: #1db954; --play-btn-color: #000; --font-family: 'JetBrains Mono', monospace; --art-radius: 0; --bar-radius: 0; }
    [data-theme="terminal"] .player { border: 1px solid #1db954; border-radius: 0; }
    [data-theme="terminal"] .player-bg, [data-theme="terminal"] .player-overlay { display: none; }

    [data-theme="bloom"] { --bg: #1a1028; --surface: #2a1e3a; --border: #4a3a5a; --text: #e8daf0; --text-dim: #9888aa; --play-btn-bg: #c4a0e8; --play-btn-color: #1a1028; --art-radius: 20px; }

    [data-theme="starry"] { --bg: #0a0a2e; --surface: #151540; --border: #2a2a60; --text: #e8e8ff; --text-dim: #8888bb; --play-btn-bg: #fff; --play-btn-color: #0a0a2e; }
    [data-theme="starry"] .player { background: radial-gradient(ellipse at 20% 50%, #12124a, #0a0a2e, #06061a); }
    [data-theme="starry"] .player-bg, [data-theme="starry"] .player-overlay { display: none; }

    [data-theme="ziro"] { --bg: #1a1a2e; --surface: #22223a; --border: #3a3a5e; --text: #e8e8f0; --text-dim: #8888aa; --play-btn-bg: #15a4ef; --play-btn-color: #fff; --art-radius: 8px; }
    [data-theme="ziro"] .player { border: none; }
    [data-theme="ziro"] .titlebar { border-bottom: 3px solid #15a4ef; }
    [data-theme="ziro"] .play-btn { border-radius: 8px; }
    [data-theme="ziro"] .player-bg, [data-theme="ziro"] .player-overlay { display: none; }
  </style>
</head>

      <div class="demo-label">Main Player</div>

    <!-- Minibar + Locket -->
    <div style="display:flex;flex-direction:column;gap:24px">

  <div class="theme-picker-demo" id="theme-picker">
    <button class="theme-chip active" data-theme="default">Default</button>
    <button class="theme-chip" data-theme="light">Light</button>
    <button class="theme-chip" data-theme="xp">XP</button>
    <button class="theme-chip" data-theme="vinyl">Vinyl</button>
    <button class="theme-chip" data-theme="neon">Neon</button>
    <button class="theme-chip" data-theme="radio">Radio</button>
    <button class="theme-chip" data-theme="retro">Retro</button>
    <button class="theme-chip" data-theme="terminal">Terminal</button>
    <button class="theme-chip" data-theme="bloom">Bloom</button>
    <button class="theme-chip" data-theme="starry">Starry</button>
    <button class="theme-chip" data-theme="ziro">Ziro</button>
  </div>

  <script>
    document.querySelectorAll('.theme-chip').forEach(chip => {
      chip.onclick = () => {
        document.querySelectorAll('.theme-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        const theme = chip.dataset.theme;
        if (theme === 'default') {
          delete document.documentElement.dataset.theme;
        } else {
          document.documentElement.dataset.theme = theme;
        }
      };
    });
  </script>
